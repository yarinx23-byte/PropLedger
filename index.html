    <!-- Loading splash: shows on every full page (re)load, then fades out once
         the app mounts (removed in main.jsx). Makes a refresh unmistakable. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #020617;
        display: grid;
        place-items: center;
        transition: opacity 0.35s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .mark {
        font: 800 26px Inter, Arial, sans-serif;
        color: #fff;
        margin-bottom: 20px;
        letter-spacing: -0.5px;
      }
      #splash .mark span {
        background: linear-gradient(135deg, #ec4899, #7c3aed);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #splash .spinner {
        width: 42px;
        height: 42px;
        margin: 0 auto;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #a855f7;
        animation: pl-spin 0.7s linear infinite;
      }
      @keyframes pl-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <div style="text-align: center">
        <div class="mark">Prop<span>Ledger</span></div>
        <div class="spinner"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
